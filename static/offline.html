<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — EduFusion</title>
  <link rel="manifest" href="/static/manifest.json" />
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --accent: #3fb950; --text: #e6edf3; --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3rem 2.5rem; text-align: center;
      max-width: 420px; width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .icon-wrap {
      width: 80px; height: 80px; border-radius: 20px;
      background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem; font-size: 2.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(63,185,80,.3); }
      50%      { box-shadow: 0 0 0 12px rgba(63,185,80,0); }
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 1.5rem; }
    .cached-note {
      background: rgba(88,166,255,.08); border: 1px solid rgba(88,166,255,.2);
      border-radius: 10px; padding: 12px 16px; font-size: 12px;
      color: #58a6ff; margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #0d1117;
      border: none; border-radius: 10px; padding: 12px 24px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      text-decoration: none; transition: all .2s;
      width: 100%; justify-content: center;
    }
    .btn:hover { background: #57d068; transform: translateY(-1px); }
    .btn-outline {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); margin-top: 10px;
    }
    .btn-outline:hover { background: var(--surface); color: var(--text); transform: none; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #f85149; margin-right: 6px; animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    footer { color: var(--muted); font-size: 11px; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">📡</div>
    <h1>You're Offline</h1>
    <p>
      <span class="status-dot"></span>No internet connection detected.<br>
      EduFusion needs a connection to load your latest data.
    </p>

    <div class="cached-note">
      ✓ Some pages may be available from cache — try navigating to Dashboard or Leave.
    </div>

    <button class="btn" onclick="retryConnection()">
      🔄 Try Again
    </button>
    <a href="/dashboard/" class="btn btn-outline">
      Go to Dashboard (cached)
    </a>

    <footer id="retryStatus" style="margin-top:1.5rem;color:var(--muted);font-size:12px">
      Checking connection...
    </footer>
  </div>

  <script>
    // Auto-retry every 5 seconds
    let attempts = 0;
    function retryConnection() {
      attempts++;
      document.getElementById('retryStatus').textContent = `Attempt ${attempts}...`;
      fetch('/static/manifest.json', { cache: 'no-store' })
        .then(() => {
          document.getElementById('retryStatus').textContent = '✓ Back online! Redirecting...';
          document.getElementById('retryStatus').style.color = '#3fb950';
          setTimeout(() => window.location.href = '/dashboard/', 800);
        })
        .catch(() => {
          document.getElementById('retryStatus').textContent =
            `Still offline. Will retry in 5s... (attempt ${attempts})`;
        });
    }

    // Auto-check every 5 seconds
    setInterval(retryConnection, 5000);
    retryConnection();
  </script>
</body>
</html>
