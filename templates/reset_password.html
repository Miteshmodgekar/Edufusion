<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#3fb950"/>
  <title>Reset Password | EduFusion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
          --accent:#3fb950;--accent2:#58a6ff;--text:#e6edf3;--muted:#8b949e;--danger:#f85149;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);
         min-height:100vh;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;
            padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
    .logo{font-family:'Space Mono',monospace;font-size:14px;color:var(--accent);}
    .main{flex:1;display:flex;align-items:center;justify-content:center;
          padding:2rem;position:relative;overflow:hidden;}
    .bg-grid{position:absolute;inset:0;
             background-image:linear-gradient(var(--border) 1px,transparent 1px),
                              linear-gradient(90deg,var(--border) 1px,transparent 1px);
             background-size:40px 40px;opacity:.3;}
    .card{position:relative;z-index:1;background:var(--surface);
          border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;}
    .card-top{padding:28px 32px 0;text-align:center;}
    .sys-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;
               color:var(--accent);background:rgba(63,185,80,.1);
               border:1px solid rgba(63,185,80,.3);border-radius:6px;
               padding:4px 12px;margin-bottom:14px;letter-spacing:1px;}
    .card-top h2{font-size:22px;font-weight:600;margin-bottom:4px;}
    .card-top p{font-size:13px;color:var(--muted);}
    .form-area{padding:22px 32px 28px;}
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;
          letter-spacing:.5px;font-family:'Space Mono',monospace;}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);
                 border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;
                 font-family:'Sora',sans-serif;outline:none;transition:border-color .2s;
                 margin-bottom:12px;}
    input:focus{border-color:var(--accent2);}
    .hint{font-size:11px;color:var(--muted);margin:-6px 0 14px}
    .btn-login{width:100%;padding:12px;background:var(--accent);border:none;
               border-radius:8px;color:#0d1117;font-size:14px;font-weight:600;
               font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s;}
    .btn-login:hover{background:#57d068;}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;}
    .err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);
         color:var(--danger);border-radius:8px;padding:10px 14px;font-size:12px;
         margin-bottom:12px;display:none;}
    .ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);
         color:var(--accent);border-radius:8px;padding:10px 14px;font-size:12px;
         margin-bottom:12px;display:none;}
    .footer{padding:12px 28px;border-top:1px solid var(--border);
            display:flex;justify-content:space-between;}
    .footer span{font-size:11px;color:var(--muted);}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">CSE<span style="color:#58a6ff">.</span>SMART<span style="color:#58a6ff">.</span>SYS</div>
  <div style="font-size:11px;color:var(--muted)">AI-Driven Academic Management System</div>
  <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">v1.0 · PWA</div>
</div>

<div class="main">
  <div class="bg-grid"></div>
  <div class="card">
    <div class="card-top">
      <div class="sys-badge">CSE DEPARTMENT PORTAL</div>
      <h2>Set a New Password</h2>
      <p>Choose a strong new password for your account</p>
    </div>

    <div class="form-area">
      <div id="errBox" class="err"></div>
      <div id="okBox" class="ok"></div>

      <label>NEW PASSWORD</label>
      <input type="password" id="p1" placeholder="••••••••" autocomplete="new-password"/>
      <div class="hint">At least 8 characters, one uppercase letter, one number.</div>

      <label>CONFIRM NEW PASSWORD</label>
      <input type="password" id="p2" placeholder="••••••••" autocomplete="new-password"/>

      <button class="btn-login" id="saveBtn" onclick="resetPassword()">Update password →</button>
    </div>
  </div>
</div>

<div class="footer">
  <span>CSE Dept. Academic Management System</span>
  <span>Flask + ML + PWA</span>
</div>

<script>
const TOKEN = "{{ token }}";

async function resetPassword() {
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  hideBoxes();

  if (!p1 || !p2) { showErr('Please fill in both password fields.'); return; }
  if (p1 !== p2)  { showErr('Passwords do not match.'); return; }

  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Updating...';
  btn.disabled    = true;

  try {
    const res  = await fetch(`/auth/reset-password/${TOKEN}`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ password: p1 }),
    });
    const data = await res.json();
    if (data.success) {
      showOk(data.message + ' Redirecting to sign in...');
      setTimeout(() => window.location.href = '/auth/login', 1800);
    } else {
      showErr(data.message || 'Could not reset password.');
      btn.textContent = 'Update password →';
      btn.disabled    = false;
    }
  } catch (e) {
    showErr('Could not connect to server. Please try again.');
    btn.textContent = 'Update password →';
    btn.disabled    = false;
  }
}

function showErr(msg) { const el = document.getElementById('errBox'); el.textContent = msg; el.style.display = 'block'; }
function showOk(msg)  { const el = document.getElementById('okBox');  el.textContent = msg; el.style.display = 'block'; }
function hideBoxes()  { document.getElementById('errBox').style.display='none'; document.getElementById('okBox').style.display='none'; }

document.addEventListener('keydown', e => { if (e.key === 'Enter') resetPassword(); });
</script>
</body>
</html>
