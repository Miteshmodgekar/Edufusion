<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#3fb950"/>
  <title>Forgot Password | EduFusion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
          --accent:#3fb950;--accent2:#58a6ff;--text:#e6edf3;--muted:#8b949e;--danger:#f85149;--warn:#d29922;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);
         min-height:100vh;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;
            padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
    .logo{font-family:'Space Mono',monospace;font-size:14px;color:var(--accent);}
    .main{flex:1;display:flex;align-items:center;justify-content:center;
          padding:2rem;position:relative;overflow:hidden;}
    .bg-grid{position:absolute;inset:0;
             background-image:linear-gradient(var(--border) 1px,transparent 1px),
                              linear-gradient(90deg,var(--border) 1px,transparent 1px);
             background-size:40px 40px;opacity:.3;}
    .card{position:relative;z-index:1;background:var(--surface);
          border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;}
    .card-top{padding:28px 32px 0;text-align:center;}
    .sys-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;
               color:var(--accent);background:rgba(63,185,80,.1);
               border:1px solid rgba(63,185,80,.3);border-radius:6px;
               padding:4px 12px;margin-bottom:14px;letter-spacing:1px;}
    .card-top h2{font-size:22px;font-weight:600;margin-bottom:4px;}
    .card-top p{font-size:13px;color:var(--muted);}
    .form-area{padding:22px 32px 28px;}
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;
          letter-spacing:.5px;font-family:'Space Mono',monospace;}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);
                 border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;
                 font-family:'Sora',sans-serif;outline:none;transition:border-color .2s;
                 margin-bottom:16px;}
    input:focus{border-color:var(--accent2);}
    .btn-login{width:100%;padding:12px;background:var(--accent);border:none;
               border-radius:8px;color:#0d1117;font-size:14px;font-weight:600;
               font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s;}
    .btn-login:hover{background:#57d068;}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;}
    .msg{border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none;line-height:1.5;}
    .msg-info{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);color:var(--accent2);}
    .msg-danger{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--danger);}
    .msg-warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);color:var(--warn);word-break:break-all;}
    .back-link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted);text-decoration:none;}
    .back-link:hover{color:var(--text);}
    .footer{padding:12px 28px;border-top:1px solid var(--border);
            display:flex;justify-content:space-between;}
    .footer span{font-size:11px;color:var(--muted);}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">CSE<span style="color:#58a6ff">.</span>SMART<span style="color:#58a6ff">.</span>SYS</div>
  <div style="font-size:11px;color:var(--muted)">AI-Driven Academic Management System</div>
  <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">v1.0 · PWA</div>
</div>

<div class="main">
  <div class="bg-grid"></div>
  <div class="card">
    <div class="card-top">
      <div class="sys-badge">CSE DEPARTMENT PORTAL</div>
      <h2>Forgot Password</h2>
      <p>Enter the email on your account and we'll send a reset link</p>
    </div>

    <div class="form-area">
      <div id="infoBox" class="msg msg-info"></div>
      <div id="errBox" class="msg msg-danger"></div>
      <div id="devBox" class="msg msg-warn"></div>

      <label>EMAIL</label>
      <input type="email" id="emailInput" placeholder="you@cse.edu" autocomplete="email"/>

      <button class="btn-login" id="sendBtn" onclick="sendReset()">Send reset link →</button>
      <a class="back-link" href="/auth/login">← Back to sign in</a>
    </div>
  </div>
</div>

<div class="footer">
  <span>CSE Dept. Academic Management System</span>
  <span>Flask + ML + PWA</span>
</div>

<script>
async function sendReset() {
  const email = document.getElementById('emailInput').value.trim();
  hideAll();
  if (!email) { showBox('errBox', 'Please enter your email.'); return; }

  const btn = document.getElementById('sendBtn');
  btn.textContent = 'Sending...';
  btn.disabled    = true;

  try {
    const res  = await fetch('/auth/forgot-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email }),
    });
    const data = await res.json();
    showBox('infoBox', data.message);
    if (data.dev_reset_url) {
      showBox('devBox', `${data.dev_note}<br><br><a href="${data.dev_reset_url}" style="color:var(--warn)">${data.dev_reset_url}</a>`);
    }
  } catch (e) {
    showBox('errBox', 'Could not connect to server. Please try again.');
  } finally {
    btn.textContent = 'Send reset link →';
    btn.disabled    = false;
  }
}

function showBox(id, html) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  el.style.display = 'block';
}
function hideAll() {
  ['infoBox','errBox','devBox'].forEach(id => document.getElementById(id).style.display = 'none');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') sendReset(); });
</script>
</body>
</html>
